<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Plot Armor — Usage Dashboard</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 14px system-ui, sans-serif; margin: 0; padding: 24px; }
      h1 { font-size: 18px; margin: 0 0 16px; }
      .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
      .card {
        border: 1px solid rgba(128, 128, 128, 0.3); border-radius: 8px;
        padding: 12px 16px; min-width: 120px;
      }
      .card .n { font-size: 22px; font-weight: 600; }
      .card .l { font-size: 12px; opacity: 0.7; margin-top: 2px; }
      .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
      button {
        font: inherit; padding: 6px 12px; border-radius: 6px;
        border: 1px solid rgba(128, 128, 128, 0.4); background: transparent; cursor: pointer;
      }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(128, 128, 128, 0.2); }
      th { position: sticky; top: 0; background: Canvas; }
      td.text { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .yes { color: #d23b3b; font-weight: 600; }
      .no { opacity: 0.6; }
      .empty { opacity: 0.6; padding: 24px 0; }
      .wrap { overflow-x: auto; }
    </style>
  </head>
  <body>
    <h1>🛡️ Plot Armor — Usage Dashboard</h1>
    <div class="cards" id="cards"></div>
    <div class="bar">
      <button id="refresh">Refresh</button>
      <button id="clear">Clear log</button>
      <span id="sites" style="opacity: 0.7"></span>
    </div>
    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th>Time</th><th>Site</th><th>Comment</th><th>Verdict</th>
            <th>Model</th><th>In</th><th>Out</th><th>ms</th><th>$</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty">No checks logged yet. Browse a supported site with the extension on.</div>
    </div>
    <script type="module" src="./dashboard.ts"></script>
  </body>
</html>
